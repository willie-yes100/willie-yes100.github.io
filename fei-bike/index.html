let TICK=-9, FIT_S=1, LEG=0, prog=0, playing=false, cam={cx:0,cy:0,s:1}, pin=null, hl=null, W=0, H=0, DPR=1;

function tAt(f){const L=leg(),T=L.T;const x=f*(T.length-1),i=Math.min(T.length-2,Math.floor(x));return T[i]+(T[i+1]-T[i])*(x-i);}

  // 區名
  g.font=`700 14px ${css('--display')}`;g.textAlign='center';g.fillStyle=C.muted;
  APP.districts.forEach(f=>{let best=null,ba=0;f.geometry.coordinates.forEach(poly=>{const r=poly[0];let a=0,cx=0,cy=0;for(let i=0,j=r.length-1;i<r.length;j=i++){const c=r[j][0]*r[i][1]-r[i][0]*r[j][1];a+=c;cx+=(r[j][0]+r[i][0])*c;cy+=(r[j][1]+r[i][1])*c;}a/=2;if(Math.abs(a)>ba){ba=Math.abs(a);best=[cx/(6*a),cy/(6*a)];}});
    const [x,y]=S(best);if(x>-50&&x<W+50&&y>-20&&y<H+20){g.globalAlpha=.55;g.fillText(f.properties.name,x,y);g.globalAlpha=1;}});
  const L=leg(),G=L.geom;
  // 其他時段的路線（淡）
  APP.legs.forEach((o,k)=>{if(k===LEG)return;line(o.geom);g.strokeStyle=C.gsoft;g.lineWidth=4;g.stroke();});
  // 本段路線：全段淡、走過的實線
  line(G);g.strokeStyle=C.gsoft;g.lineWidth=7;g.stroke();
  if(hl){g.save();g.strokeStyle=C.pink;g.lineWidth=10;g.globalAlpha=.6;hl.forEach(r=>{line(G.slice(r[0],Math.max(r[1],r[0]+1)+1));g.stroke();});g.restore();}
  const n=Math.floor(prog*(G.length-1));
  const head=posAt(prog);
  line([...G.slice(0,n+1),head]);g.strokeStyle=C.green;g.lineWidth=5;g.stroke();
  // 現在這條路加粗
  const cs=L.segs[Math.max(0,TICK)];if(cs&&!cs.temple&&cs.i1>cs.i0){g.save();line(G.slice(cs.i0,cs.i1+1));g.strokeStyle=C.green;g.globalAlpha=.35;g.lineWidth=13;g.stroke();g.restore();}
  // 方向箭頭
  g.fillStyle=C.paper;for(let i=40;i<G.length-1;i+=60){const [x1,y1]=S(G[i]),[x2,y2]=S(G[i+1]);const a=Math.atan2(y2-y1,x2-x1);g.save();g.translate(x1,y1);g.rotate(a);g.beginPath();g.moveTo(3.5,0);g.lineTo(-2.5,-2.6);g.lineTo(-2.5,2.6);g.closePath();g.fill();g.restore();}
  // 停靠的廟
  L.stops.forEach(s=>{const [x,y]=S(s.pos);g.beginPath();g.arc(x,y,8,0,7);g.fillStyle=C.pink;g.fill();g.lineWidth=3;g.strokeStyle=C.paper;g.stroke();
    g.font=`900 12px ${css('--display')}`;g.textAlign='left';g.lineWidth=4;g.strokeStyle=C.paper;g.strokeText(s.name,x+12,y+5);g.fillStyle=C.ink;g.fillText(s.name,x+12,y+5);
    g.font=`600 10.5px ${css('--mono')}`;g.strokeText(fmt(s.t),x+12,y+19);g.fillStyle=C.pink;g.fillText(fmt(s.t),x+12,y+19);});
  // 我家釘
  if(pin){const [x,y]=S(pin.p);g.beginPath();g.arc(x,y,7,0,7);g.fillStyle=C.ink;g.fill();const [qx,qy]=S(pin.q);g.save();g.setLineDash([4,4]);g.strokeStyle=C.ink;g.lineWidth=1.5;g.beginPath();g.moveTo(x,y);g.lineTo(qx,qy);g.stroke();g.restore();}
  // 車隊
  const [hx,hy]=S(head);const pul=(performance.now()/900)%1;
  g.beginPath();g.arc(hx,hy,8+16*pul,0,7);g.fillStyle=C.green;g.globalAlpha=.25*(1-pul);g.fill();g.globalAlpha=1;
  bikeIcon(hx,hy,C.green,LIVE.pts.length&&LIVE.delay!=null?.45:1);
  if(cs&&LIVE.delay==null){g.font=`900 13px ${css('--display')}`;g.textAlign='left';g.lineWidth=5;g.strokeStyle=C.paper;g.strokeText(cs.name,hx+21,hy+5);g.fillStyle=C.green;g.fillText(cs.name,hx+21,hy+5);}
  // 實際軌跡（即時定位）
  if(LIVE.pts.length){line(LIVE.pts);g.strokeStyle=C.ink;g.lineWidth=3;g.setLineDash([2,5]);g.stroke();g.setLineDash([]);
    const [lx,ly]=S(LIVE.pts[LIVE.pts.length-1]);const pl=(performance.now()/700)%1;
    g.beginPath();g.arc(lx,ly,22+26*pl,0,7);g.fillStyle=C.pink;g.globalAlpha=.3*(1-pl);g.fill();g.globalAlpha=1;
    bikeIcon(lx,ly,C.pink,1,21);   // 即時位置比預估大一號
    g.font=`900 16px ${css('--display')}`;g.textAlign='left';g.lineWidth=5;g.strokeStyle=C.paper;g.strokeText('即時位置',lx+29,ly+6);g.fillStyle=C.pink;g.fillText('即時位置',lx+29,ly+6);}
}

const idxNow=()=>prog*(leg().geom.length-1);
function setProg(f,fromScrub){prog=Math.max(0,Math.min(1,f));tNow=tAt(prog);$('clk').textContent=fmt(tNow);
  if(!fromScrub)$('scrub').value=Math.round(prog*1000);
  const L=leg();const at=L.stops.find(s=>Math.abs(tNow-s.t)<0.2+0&&false);
  const stopNow=L.stops.find(s=>s.dwell>0&&tNow>=s.t&&tNow<=s.t+s.dwell&&Math.abs(prog*(L.geom.length-1)-s.at)<3);
  $('clkSub').textContent=stopNow?`停在${stopNow.name}`:`預估位置・${L.district}`;
  // 跑馬燈：現在騎在哪條路
  {const sg=L.segs;let c=0;sg.forEach((x,k)=>{if(x.i0<=idxNow())c=k;});if(c!==TICK){TICK=c;const lis=$('tick').children;[...lis].forEach((li,k)=>{li.classList.toggle('cur',k===c);const tg=li.querySelector('.tag');if(!sg[k].temple){tg.textContent=k<c?'騎過':k===c?'騎在':k===c+1?'下一條':'';tg.hidden=!tg.textContent;}});$('tick').style.transform=`translateY(${(1-c)*23}px)`;}}
  // 路口清單跟著亮
  const idx=prog*(L.geom.length-1);let cur=-1;L.turns.forEach((t,k)=>{if(t.i<=idx)cur=k;});
  [...$('turns').children].forEach((li,k)=>li.classList.toggle('on',k===cur));
  draw();}

// 播放：預估 3 小時壓成約 40 秒
let last=0;
function tick(ts){if(playing){const L=leg();const dt=(ts-last)/1000;const span=L.T[L.T.length-1]-L.T[0];
  let t=tNow+dt*span/40;if(t>=L.T[L.T.length-1]){t=L.T[L.T.length-1];playing=false;$('play').textContent='▶';}
  setProg(fAtTime(t));tNow=t;$('clk').textContent=fmt(t);}
  else draw();
  last=ts;requestAnimationFrame(tick);}

function selectLeg(k){LEG=k;pin=null;hl=null;$('ans').hidden=true;
  [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===k));
  const L=leg();
  $('ticks').innerHTML=`<span>${L.start}</span><span>${L.district}・${L.km.toFixed(1)} 公里</span><span>約 ${fmt(L.end)}</span>`;
  $('stops').innerHTML=L.stops.map((s,i)=>`<li data-i="${i}"><time>${fmt(s.t)}</time><span class="nm">${s.name}</span><span class="k">${s.kind}${s.dwell?`・${s.dwell} 分`:''}</span></li>`).join('');
  $('nTurns').textContent=L.turns.length;
  $('tick').innerHTML=L.segs.map(x=>`<li class="${x.temple?'temple':''}"><time>${fmt(x.t)}</time><span class="tag">${x.temple?x.temple:'騎在'}</span><span class="nm">${x.name}</span></li>`).join('');TICK=-9;
  $('turns').innerHTML=L.turns.map((t,i)=>`<li data-i="${i}"><time>${fmt(t.t)}</time><span>${t.label.replace('→',' → ').replace('（往',' （往')}</span></li>`).join('');
  const names=new Set();L.streets.forEach(s=>s&&!/宮|廟|殿|府/.test(s)&&names.add(s));
  $('streets').innerHTML=[...names].map(n=>`<option value="${n}">`).join('');
  fit();setProg(0);}

// 查路名：在路線上找這條街的段落 → 時間區間
function ask(name){
  name=name.trim();if(!name)return;const L=leg();
  const segs=APP.streets.filter(s=>s.n&&(s.n===name||s.n.startsWith(name)||name.startsWith(s.n)&&s.n.length>=3));
  const G=L.geom;const hit=[];
  const segD=(p,a,b)=>{const ax=(a[0]-p[0])*KX,ay=a[1]-p[1],bx=(b[0]-p[0])*KX,by=b[1]-p[1],dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?-(ax*dx+ay*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx,ay+t*dy)*111320;};
  G.forEach((p,i)=>{for(const s of segs){for(let k=1;k<s.g.length;k++){if(segD(p,s.g[k-1],s.g[k])<20){hit.push(i);return;}}}});
  if(!hit.length){
    const other=APP.legs.findIndex((o,k)=>k!==LEG&&o.streets.some(x=>x&&x.startsWith(name)));
    show(other>=0?`今天${APP.legs[other].district}那段有經過「${name}」，切到上面的「${APP.legs[other].district}」看時間。`:`這段路線沒有騎到「${name}」。可以直接點地圖上你家的位置，看最近會經過哪裡。`);hl=null;draw();return;}
  // 合併成連續段
  const runs=[];let a=hit[0],b=hit[0];for(const i of hit.slice(1)){if(i-b<=6)b=i;else{runs.push([a,b]);a=b=i;}}runs.push([a,b]);
  hl=runs;
  // 時間上 5 分鐘內的段落合併，同一分鐘不寫區間
  const tr=[];runs.forEach(r=>{const a=L.T[r[0]],b=L.T[r[1]];const l=tr[tr.length-1];if(l&&a-l[1]<5)l[1]=b;else tr.push([a,b]);});
  const dl=LIVE.delay??0; const txt=tr.slice(0,4).map(([a,b])=>[a+dl,b+dl]).map(([a,b])=>`<strong>${fmt(a)}</strong>${b-a>=2?`到 ${fmt(b)} `:''}`).join('、')+(tr.length>4?' 等':'');
  show(`預計 ${txt}經過「${name}」${delayNote()}<br><span class="hint">⏰ 預估時間會有誤差，請提早 10 分鐘到路線上等待。</span>`);
  zoomTo(G.slice(runs[0][0],runs[0][1]+1));setProg(runs[0][0]/(G.length-1));}
function show(h){const a=$('ans');a.innerHTML=h;a.hidden=false;}
function zoomTo(pts){let a=[1e9,1e9,-1e9,-1e9];pts.forEach(p=>{const q=P(p);a[0]=Math.min(a[0],q[0]);a[1]=Math.min(a[1],q[1]);a[2]=Math.max(a[2],q[0]);a[3]=Math.max(a[3],q[1]);});
  cam.cx=(a[0]+a[2])/2;cam.cy=(a[1]+a[3])/2;cam.s=Math.max(FIT_S*2.5,Math.min(FIT_S*3.5,(W-80)/Math.max(1e-6,a[2]-a[0]),(H-200)/Math.max(1e-6,a[3]-a[1])));draw();}
function askPoint(p){const L=leg(),G=L.geom;let bi=0,bd=1e12;G.forEach((q,i)=>{const d=dist(p,q);if(d<bd){bd=d;bi=i;}});
  pin={p,q:G[bi]};hl=null;
  if(bd>1500){show(`這裡離${L.district}路線約 ${(bd/1000).toFixed(1)} 公里，今天這段應該騎不到附近。`);}
  else show(`最近的路線點在 ${Math.round(bd/10)*10} 公尺外，預計 <strong>${fmt(L.T[bi]+(LIVE.delay??0))}</strong>前後經過${delayNote()}<br><span class="hint">⏰ 預估時間會有誤差，請提早 10 分鐘到路線上等待。</span>`);
  setProg(bi/(G.length-1));}

// 拖曳、縮放、雙指
const pts=new Map();let moved=0,pinch0=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;cv.classList.add('drag');
  if(pts.size===2){const [a,b]=[...pts.values()];pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:cam.s};}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId),n=[e.offsetX,e.offsetY];pts.set(e.pointerId,n);
  if(pts.size===1){cam.cx-=(n[0]-o[0])/cam.s;cam.cy-=(n[1]-o[1])/cam.s;moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);}
  else if(pts.size===2&&pinch0){const [a,b]=[...pts.values()];const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];zoomAt(mid,pinch0.s*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch0.d/cam.s);moved=99;}
  draw();});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null;cv.classList.remove('drag');if(e.type==='pointerup'&&moved<6&&pts.size===0)askPoint(U(e.offsetX,e.offsetY));};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function zoomAt([x,y],k){const before=U(x,y);cam.s=Math.max(FIT_S*0.4,Math.min(FIT_S*30,cam.s*k));const after=U(x,y);cam.cx+=(before[0]-after[0])*KX;cam.cy-=(before[1]-after[1]);draw();}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt([e.offsetX,e.offsetY],Math.exp(-e.deltaY*0.0015));},{passive:false});
$('zin').onclick=()=>zoomAt([W/2,H/2],1.4);$('zout').onclick=()=>zoomAt([W/2,H/2],1/1.4);$('fit').onclick=fit;
$('play').onclick=()=>{if(prog>=1)setProg(0);playing=!playing;$('play').textContent=playing?'❚❚':'▶';$('play').setAttribute('aria-label',playing?'暫停':'播放');};
$('scrub').oninput=e=>{playing=false;$('play').textContent='▶';setProg(e.target.value/1000,true);};
$('go').onclick=()=>ask($('q').value);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask(e.target.value);});
$('stops').onclick=e=>{const li=e.target.closest('li');if(!li)return;const s=leg().stops[+li.dataset.i];setProg(s.at/(leg().geom.length-1));zoomTo([s.pos]);};
$('turns').onclick=e=>{const li=e.target.closest('li');if(!li)return;const t=leg().turns[+li.dataset.i];setProg(t.i/(leg().geom.length-1));zoomTo([leg().geom[t.i]]);};

// 標題、分段按鈕
const d=new Date(APP.date+'T00:00:00'),wd='日一二三四五六'[d.getDay()];
$('h1').innerHTML=`${d.getMonth()+1}/${d.getDate()}（${wd}）妃妃鐵馬 <em>騎到哪</em>`;
$('tabs').innerHTML=APP.legs.map((L,i)=>`<button class="tab" role="tab" aria-selected="${i===0}" id="tab${i}">${L.district}<small>${L.start} 出發・約 ${fmt(L.end)} 結束</small></button>`).join('');
APP.legs.forEach((L,i)=>$('tab'+i).onclick=()=>selectLeg(i));
new ResizeObserver(()=>{resize();fit();}).observe(box);
resize();
// 依現在時間預設：下午就開仁德那段
const nowM=new Date().getHours()*60+new Date().getMinutes();
const today=new Date(),iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const def=iso===APP.date?APP.legs.reduce((k,L,i)=>nowM>=parseInt(L.start)*60-60?i:k,0):0;
selectLeg(def);
requestAnimationFrame(t=>{last=t;tick(t);});

// ── 即時定位：隨香地圖公開資料，每 30 秒抓一次（跟他們網頁同頻率）。
// 放在一般網站上會動；claude.ai 預覽頁擋外部連線，抓不到時只顯示預估、按鈕連去即時頁。
function delayNote(){if(LIVE.delay==null)return '';const d=Math.round(LIVE.delay);return d===0?'（已照車隊即時位置修正：準時）':`（已照車隊即時位置修正：比預估${d>0?'晚':'早'} ${Math.abs(d)} 分）`;}
async function pollLive(){
  try{
    const r=await fetch('https://gps.godroad.tw/Sever?SA_ID=E261101',{cache:'no-store'});const d=(await r.json())[0];
    const gp=(d.GPS||[]).map(q=>[+q.lng,+q.lat]).reverse();const cur=gp[gp.length-1];if(!cur)return;
    const t=d.gps_time||'';LIVE.state=d.gpsType;LIVE.at=t;
    const iso=t.slice(0,10), hm=+t.slice(11,13)*60+ +t.slice(14,16);
    gp.forEach(p=>{const l=LIVE.pts[LIVE.pts.length-1];if(!l||dist(l,p)>5)LIVE.pts.push(p);});if(LIVE.pts.length>4000)LIVE.pts.splice(0,LIVE.pts.length-4000);
    const bar=$('livebar');bar.hidden=false;
    if(iso!==APP.date||/停止/.test(d.gpsType||'')){LIVE.delay=null;bar.innerHTML=`即時定位：${/停止/.test(d.gpsType||'')?'還沒開始發送':'今天還沒出發'}`;draw();return;}
    // 找最近的那一段路線，比預估時間
    // 距離＋時間一起看：起點終點同一座廟時才不會對錯
    let best=null;APP.legs.forEach((L,k)=>L.geom.forEach((q,i)=>{const dd=dist(cur,q),sc=dd+8*Math.abs(L.T[i]-hm);if(!best||sc<best.sc)best={k,i,d:dd,sc};}));
    if(best&&best.d<400){LIVE.delay=hm-APP.legs[best.k].T[best.i];if(hm<+APP.legs[best.k].start.slice(0,2)*60+ +APP.legs[best.k].start.slice(3,5)&&best.i<APP.legs[best.k].geom.length*0.1)LIVE.delay=0;if(!LIVE.switched){LIVE.switched=1;if(best.k!==LEG)selectLeg(best.k);if(!playing)setProg(best.i/(APP.legs[best.k].geom.length-1));}
      bar.innerHTML=`即時 ${t.slice(11,16)}・${d.addr?d.addr.replace(/^臺南市..區/,'').replace(/\d.*$/,''):''}・<b>${Math.abs(Math.round(LIVE.delay))<3?'準時':`${LIVE.delay>0?'晚':'早'} ${Math.abs(Math.round(LIVE.delay))} 分`}</b>`;}
    else{LIVE.delay=null;bar.innerHTML=`即時 ${t.slice(11,16)}・${d.addr||''}（不在預定路線上）`;}
    draw();
  }catch(e){/* 抓不到就只顯示預估 */}
}
pollLive();setInterval(pollLive,30000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
